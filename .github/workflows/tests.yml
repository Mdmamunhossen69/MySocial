name: Tests

# Runs on pull requests and pushes. Uses NO secrets and cannot touch your Firebase project:
# the scripts are tested against an in-memory imitation of Firestore.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: python3 tests/check-imports.py .
